<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Local AI Gradle module dependency graph">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .t2{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}
      .ttl2{font-size:30px;font-weight:700}
      .sub2{font-size:14.5px;fill:#64748b}
      .nt2{font-size:13px;font-weight:600;fill:#0f172a}
      .nb2{font-size:10.5px;fill:#475569}
      .ar2{stroke:#94a3b8;stroke-width:2;fill:none}
      .ar2d{stroke:#0d9488;stroke-width:2;fill:none;stroke-dasharray:6 5}
      .lg2{font-size:11.5px;fill:#475569}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text class="t2 ttl2" x="40" y="52">Gradle Module Graph</text>
  <text class="t2 sub2" x="40" y="78">Nine libraries plus the app: pure-Kotlin contracts at the bottom, capabilities in the middle, the Android app on top. Arrows point at the dependency.</text>

  <g filter="url(#sh2)">
    <rect x="600" y="130" width="280" height="80" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
    <text class="t2 nt2" x="616" y="158">:shared — Kotlin Multiplatform</text>
    <text class="t2 nb2" x="616" y="178">Platform contracts (HTTP, files, JWT, media,</text>
    <text class="t2 nb2" x="616" y="194">logs, haptics) + pure AI types and registry</text>
  </g>
  <path class="ar2" d="M740,250 V214" marker-end="url(#a2)"/>

  <g filter="url(#sh2)">
    <rect x="600" y="250" width="280" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text class="t2 nt2" x="616" y="278">:common — Android adapters</text>
    <text class="t2 nb2" x="616" y="298">OkHttp based PlatformHttpClient, file store,</text>
    <text class="t2 nb2" x="616" y="314">URL / JSON / HTML helpers, log ring buffer</text>
  </g>
  <text class="t2 nb2" x="896" y="294" fill="#2563eb">api(project(":shared")) — re-exported to every consumer</text>

  <path class="ar2" d="M195,420 V384 M357,420 V384 M519,420 V384 M681,420 V384" />
  <path class="ar2" d="M195,384 H740" />
  <path class="ar2" d="M740,384 V334" marker-end="url(#a2)"/>
  <text class="t2 nb2" x="756" y="372" fill="#2563eb">ai · tts · speech · search all depend on :common</text>

  <g filter="url(#sh2)">
    <rect x="120" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="134" y="446">:ai</text>
    <text class="t2 nb2" x="134" y="466">provider layer:</text>
    <text class="t2 nb2" x="134" y="482">OpenAI, Google,</text>
    <text class="t2 nb2" x="134" y="498">Claude, ComfyUI</text>
    <rect x="282" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="296" y="446">:tts</text>
    <text class="t2 nb2" x="296" y="466">9 TTS providers</text>
    <text class="t2 nb2" x="296" y="482">+ Media3 playback</text>
    <rect x="444" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="458" y="446">:speech</text>
    <text class="t2 nb2" x="458" y="466">6 ASR / realtime</text>
    <text class="t2 nb2" x="458" y="482">voice controllers</text>
    <rect x="606" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="620" y="446">:search</text>
    <text class="t2 nb2" x="620" y="466">15 web search</text>
    <text class="t2 nb2" x="620" y="482">providers</text>
    <rect x="768" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="782" y="446">:highlight</text>
    <text class="t2 nb2" x="782" y="466">QuickJS + PrismJS</text>
    <text class="t2 nb2" x="782" y="482">syntax highlighting</text>
    <rect x="930" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="944" y="446">:document</text>
    <text class="t2 nb2" x="944" y="466">MuPDF PDF, DOCX</text>
    <text class="t2 nb2" x="944" y="482">to Markdown</text>
    <rect x="1092" y="420" width="150" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text class="t2 nt2" x="1106" y="446">:workspace</text>
    <text class="t2 nb2" x="1106" y="466">PRoot Linux</text>
    <text class="t2 nb2" x="1106" y="482">sandbox + NDK</text>
  </g>
  <path class="ar2d" d="M681,520 V580 H195" />
  <path class="ar2d" d="M519,520 V580" />
  <path class="ar2d" d="M195,580 V524" marker-end="url(#a2d)"/>
  <text class="t2 nb2" x="705" y="586" fill="#0d9488">also depends on :ai (search, speech)</text>

  <path class="ar2" d="M150,660 H1212" />
  <path class="ar2" d="M195,660 V648 M357,660 V648 M519,660 V648 M681,660 V648 M843,660 V648 M1005,660 V648 M1167,660 V648" />
  <path class="ar2" d="M400,700 V664" marker-end="url(#a2)"/>
  <text class="t2 nb2" x="416" y="690" fill="#64748b">:app consumes every library module</text>

  <g filter="url(#sh2)">
    <rect x="120" y="700" width="560" height="100" rx="12" fill="#f0fdfa" stroke="#14b8a6"/>
    <text class="t2 nt2" x="138" y="730">:app — the Android application (applicationId lastchat.rikkafork.cocolal)</text>
    <text class="t2 nb2" x="138" y="750">UI + ViewModels + Koin DI + Room + DataStore + WorkManager + widgets + share</text>
    <text class="t2 nb2" x="138" y="766">ChatService + GenerationHandler + Ktor web server + web-ui asset bundling</text>
    <text class="t2 nb2" x="138" y="786">Embedded Ktor server, Ktor web-api, and the PRoot tool bridge live here</text>
    <rect x="712" y="700" width="200" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="t2 nt2" x="726" y="730">:app:baselineprofile</text>
    <text class="t2 nb2" x="726" y="750">com.android.test module that</text>
    <text class="t2 nb2" x="726" y="766">generates the Baseline Profile</text>
    <text class="t2 nb2" x="726" y="786">for faster cold starts</text>
    <rect x="944" y="700" width="280" height="100" rx="12" fill="#f7fbfe" stroke="#7dd3fc" stroke-dasharray="6 5"/>
    <text class="t2 nt2" x="958" y="730">web-ui/ — React Router 7 SPA</text>
    <text class="t2 nb2" x="958" y="750">Plain npm project (not a Gradle module).</text>
    <text class="t2 nb2" x="958" y="766">:app's buildWebUi task runs "npm run build"</text>
    <text class="t2 nb2" x="958" y="782">before preBuild and bundles build/client</text>
    <text class="t2 nb2" x="958" y="798">as Android assets served by Ktor</text>
  </g>
  <path class="ar2" d="M712,750 H684" marker-end="url(#a2)"/>
  <path class="ar2d" d="M1084,800 V834 H400 V804" marker-end="url(#a2d)"/>
  <text class="t2 nb2" x="560" y="852" fill="#0d9488">preBuild → npm run build → assets</text>

  <text class="t2 nb2" x="768" y="540" fill="#92400e">:highlight, :document and :workspace have no project dependencies</text>

  <text class="t2 lg2" x="40" y="876">Dependency direction: the arrow points at the module being depended on. :shared is the only KMP module (Android + iOS arm64, sim-arm64, x64 → LastChatShared).</text>
  <text class="t2 lg2" x="40" y="894">:ai, :common, :search, :highlight, :document and :tts are iOS-portability candidates — see docs/ios-portability.md.</text>
</svg>
